<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title"><title id="title">충전 · 파일 · 화면은 별도 확인: 충전: 기기와 전원 조건 → 파일: 데이터 규격 → 화면: 영상 지원</title><rect width="600" height="400" rx="16" fill="#eef4f1"/><text x="24" y="52" font-family="Malgun Gothic,sans-serif" font-size="30" fill="#173d35">충전 · 파일 · 화면은 별도 확인</text><rect x="20" y="80" width="560" height="70" rx="10" fill="#fff"/><text x="36" y="126" font-family="Malgun Gothic,sans-serif" font-size="32" fill="#173d35">1. 충전: 기기와 전원 조건</text><rect x="20" y="170" width="560" height="70" rx="10" fill="#fff"/><text x="36" y="216" font-family="Malgun Gothic,sans-serif" font-size="32" fill="#173d35">2. 파일: 데이터 규격</text><rect x="20" y="260" width="560" height="70" rx="10" fill="#fff"/><text x="36" y="306" font-family="Malgun Gothic,sans-serif" font-size="32" fill="#173d35">3. 화면: 영상 지원</text><text x="24" y="380" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#536c63">자체 안내 도식 · 제품 사진 아님</text></svg>