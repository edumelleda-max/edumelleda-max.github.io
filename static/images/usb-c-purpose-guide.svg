<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">USB-C 케이블 구매 전 볼 세 가지</title><desc id="d">충전은 출력 W, 파일 복사는 데이터 속도, 모니터 연결은 영상 지원을 각각 확인합니다. 자체 제작 개념도이며 제품 사진이 아닙니다.</desc>
<rect width="1200" height="630" fill="#142c37"/><circle cx="1130" cy="70" r="240" fill="#1b3d48"/>
<g font-family="Malgun Gothic, sans-serif"><text x="66" y="75" fill="#80dbc6" font-size="22">리뷰의 정석 · 구매 전 30초</text><text x="66" y="144" fill="white" font-size="46" font-weight="700">240W 다음 줄도 보셨나요?</text><text x="66" y="191" fill="#b4cbd2" font-size="25">충전 숫자 하나로 데이터와 영상까지 판단하지 마세요.</text>
<rect x="66" y="247" width="340" height="238" rx="20" fill="#f7faf9"/><rect x="430" y="247" width="340" height="238" rx="20" fill="#f7faf9"/><rect x="794" y="247" width="340" height="238" rx="20" fill="#f7faf9"/>
<g fill="#18313a"><text x="96" y="299" font-size="23">01  충전</text><text x="96" y="359" font-size="38" font-weight="700">출력 W</text><text x="96" y="413" font-size="22">기기·충전기 조건 확인</text><text x="96" y="449" font-size="22">어댑터 포함 여부 확인</text>
<text x="460" y="299" font-size="23">02  파일 복사</text><text x="460" y="359" font-size="38" font-weight="700">데이터 속도</text><text x="460" y="413" font-size="22">케이블의 데이터 규격</text><text x="460" y="449" font-size="22">SSD·컴퓨터 조건 대조</text>
<text x="824" y="299" font-size="23">03  모니터 연결</text><text x="824" y="359" font-size="38" font-weight="700">영상 지원</text><text x="824" y="413" font-size="22">케이블·기기·화면 조건</text><text x="824" y="449" font-size="22">모델별 공식 안내 확인</text></g>
<text x="66" y="550" fill="#80dbc6" font-size="25">필요한 사양이 안 보이면, 구매 전에 먼저 확인하세요.</text><text x="66" y="592" fill="#adc4ca" font-size="18">자체 제작 선택 도식 · 제품 실물 사진 아님 · 자료 기반 비교</text></g></svg>
