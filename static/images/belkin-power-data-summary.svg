<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">240W는 충전 전력, 20Gbps는 전송 규격</title><desc id="desc">벨킨 INZ004bt2MBK의 제조사 사양 요약. 실제 속도와 출력은 연결 조건에 따라 달라집니다.</desc><rect width="640" height="300" rx="16" fill="#eef4f1"/><g font-family="Malgun Gothic,sans-serif" text-anchor="middle" fill="#173d35"><text x="320" y="38" font-size="23">벨킨 INZ004bt2MBK · 사양 요약</text><rect x="20" y="60" width="290" height="158" rx="12" fill="white"/><rect x="330" y="60" width="290" height="158" rx="12" fill="white"/><text x="165" y="102" font-size="27">충전 전력</text><text x="475" y="102" font-size="27">데이터 전송 규격</text><text x="165" y="169" font-size="43" font-weight="bold">최대 240W</text><text x="475" y="169" font-size="43" font-weight="bold">20Gbps</text><path d="M48 188H281 M360 188H590" stroke="#d33b32" stroke-width="4"/><text x="320" y="263" font-size="23">실제 속도와 출력은 연결 조건에 따라 달라집니다.</text></g></svg>