<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="숫자보다 내 조건부터"><rect width="1200" height="600" fill="#153a36"/><g font-family="Malgun Gothic,sans-serif"><text x="60" y="76" fill="#9de0c5" font-size="22">리뷰의 정석 · 자료 기반 가이드</text><text x="60" y="151" fill="#fff" font-size="46" font-weight="700">숫자보다 내 조건부터</text><text x="60" y="202" fill="#c0d7cd" font-size="26">충전 케이블 선택의 세 가지 질문</text><rect x="60" y="255" width="340" height="224" rx="18" fill="#f4f8f5"/><text x="87" y="315" fill="#153a36" font-size="31" font-weight="700">1. 기기 조건</text><text x="87" y="376" fill="#304e43" font-size="23">정확한 모델과</text><text x="87" y="416" fill="#304e43" font-size="23">공식 호환 안내</text><rect x="425" y="255" width="340" height="224" rx="18" fill="#f4f8f5"/><text x="452" y="315" fill="#153a36" font-size="31" font-weight="700">2. 필요한 길이</text><text x="452" y="376" fill="#304e43" font-size="23">2m로 충분한가?</text><text x="452" y="416" fill="#304e43" font-size="23">더 긴 옵션이 필요한가?</text><rect x="790" y="255" width="340" height="224" rx="18" fill="#f4f8f5"/><text x="817" y="315" fill="#153a36" font-size="31" font-weight="700">3. 추가 용도</text><text x="817" y="376" fill="#304e43" font-size="23">충전 외 데이터·영상도</text><text x="817" y="416" fill="#304e43" font-size="23">필요한지 따로 확인</text><text x="60" y="548" fill="#b7d6c8" font-size="20">자체 제작 개념도 · 제품 사진·실측 결과·호환 보장이 아닙니다.</text></g></svg>