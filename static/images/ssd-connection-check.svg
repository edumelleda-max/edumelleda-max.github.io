<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="T7이 느리다면, 먼저 기록"><rect width="1200" height="600" fill="#153a36"/><g font-family="Malgun Gothic,sans-serif"><text x="60" y="76" fill="#9de0c5" font-size="22">리뷰의 정석 · 자료 기반 가이드</text><text x="60" y="151" fill="#fff" font-size="46" font-weight="700">T7이 느리다면, 먼저 기록</text><text x="60" y="202" fill="#c0d7cd" font-size="26">새 케이블을 사기 전 연결 구성 확인</text><rect x="60" y="255" width="340" height="224" rx="18" fill="#f4f8f5"/><text x="87" y="315" fill="#153a36" font-size="31" font-weight="700">1. 모델·케이블</text><text x="87" y="376" fill="#304e43" font-size="23">일반 T7인지 확인</text><text x="87" y="416" fill="#304e43" font-size="23">동봉·교체 케이블 구분</text><rect x="425" y="255" width="340" height="224" rx="18" fill="#f4f8f5"/><text x="452" y="315" fill="#153a36" font-size="31" font-weight="700">2. 연결 경로</text><text x="452" y="376" fill="#304e43" font-size="23">컴퓨터 포트 규격</text><text x="452" y="416" fill="#304e43" font-size="23">허브·젠더 사용 여부</text><rect x="790" y="255" width="340" height="224" rx="18" fill="#f4f8f5"/><text x="817" y="315" fill="#153a36" font-size="31" font-weight="700">3. 다음 조치</text><text x="817" y="376" fill="#304e43" font-size="23">구성을 정리한 뒤</text><text x="817" y="416" fill="#304e43" font-size="23">제조사 지원에 문의</text><text x="60" y="548" fill="#b7d6c8" font-size="20">자체 제작 개념도 · 제품 사진·실측 결과·호환 보장이 아닙니다.</text></g></svg>