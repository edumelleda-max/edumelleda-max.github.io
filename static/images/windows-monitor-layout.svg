<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title"><title id="title">화면 위치 맞추기: 화면 번호 식별 → 책상 위치대로 배치 → 적용 후 마우스 확인</title><rect width="600" height="400" rx="16" fill="#eef4f1"/><text x="24" y="52" font-family="Malgun Gothic,sans-serif" font-size="30" fill="#173d35">화면 위치 맞추기</text><rect x="20" y="80" width="560" height="70" rx="10" fill="#fff"/><text x="36" y="126" font-family="Malgun Gothic,sans-serif" font-size="32" fill="#173d35">1. 화면 번호 식별</text><rect x="20" y="170" width="560" height="70" rx="10" fill="#fff"/><text x="36" y="216" font-family="Malgun Gothic,sans-serif" font-size="32" fill="#173d35">2. 책상 위치대로 배치</text><rect x="20" y="260" width="560" height="70" rx="10" fill="#fff"/><text x="36" y="306" font-family="Malgun Gothic,sans-serif" font-size="32" fill="#173d35">3. 적용 후 마우스 확인</text><text x="24" y="380" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#536c63">자체 안내 도식 · 제품 사진 아님</text></svg>