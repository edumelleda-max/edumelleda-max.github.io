<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title"><title id="title">화면 식별 → 책상처럼 배치 → 적용 후 이동 확인</title><rect width="900" height="420" rx="20" fill="#eef4f1"/><text x="45" y="65" font-family="Malgun Gothic,sans-serif" font-size="26" fill="#173d35">리뷰의 정석 · 확인 순서</text><rect x="45" y="90" width="810" height="65" rx="12" fill="#fff"/><text x="70" y="133" font-family="Malgun Gothic,sans-serif" font-size="28" fill="#173d35">1. 화면 식별</text><rect x="45" y="180" width="810" height="65" rx="12" fill="#fff"/><text x="70" y="223" font-family="Malgun Gothic,sans-serif" font-size="28" fill="#173d35">2. 책상처럼 배치</text><rect x="45" y="270" width="810" height="65" rx="12" fill="#fff"/><text x="70" y="313" font-family="Malgun Gothic,sans-serif" font-size="28" fill="#173d35">3. 적용 후 이동 확인</text><text x="45" y="395" font-family="Malgun Gothic,sans-serif" font-size="17" fill="#536c63">직접 만든 안내 도식 · 제품 사진이나 시험 결과가 아닙니다</text></svg>